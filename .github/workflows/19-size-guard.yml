name: 📏 Size Guard

on:
  issues:
    types: [opened, edited, labeled, reopened, assigned]

permissions:
  contents: read
  issues: write

jobs:
  guard:
    runs-on: ${{ vars.PM_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7

      - id: pm
        uses: ./.github/actions/pm-resolve
        with:
          token: ${{ secrets.PROJECT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Require decomposition for XL
        if: steps.pm.outputs.found == 'true'
        uses: actions/github-script@v9
        env:
          PROJECT_ID: ${{ steps.pm.outputs.project-id }}
        with:
          github-token: ${{ secrets.PROJECT_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const MIN_SUB_ISSUES = 2;
            const number = context.payload.issue.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const q = `
              query($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  issue(number: $number) {
                    subIssues(first: 1) { totalCount }
                    projectItems(first: 20) {
                      nodes {
                        project { id }
                        status: fieldValueByName(name: "Status") {
                          ... on ProjectV2ItemFieldSingleSelectValue { name }
                        }
                        size: fieldValueByName(name: "Size") {
                          ... on ProjectV2ItemFieldSingleSelectValue { name }
                        }
                      }
                    }
                  }
                }
              }`;
            const res = await github.graphql(q, { owner, repo, number });
            const issue = res.repository.issue;
            const item = issue.projectItems.nodes
              .find((i) => i.project.id === process.env.PROJECT_ID);
            if (!item) return;

            const { canonical, flow } = require('./.github/scripts/board-vocab.js');
            const s = canonical(item.status && item.status.name);
            const active = s === flow().committed || flow().active.includes(s);
            if (!active) return;

            const size = (item.size && item.size.name || '').trim().toUpperCase();
            if (size !== 'XL') { core.info(`#${number} size ${size || 'unset'}, guard not applicable`); return; }

            const count = issue.subIssues.totalCount;
            if (count >= MIN_SUB_ISSUES) { core.info(`#${number} XL with ${count} sub-issues, satisfied`); return; }

            await github.rest.issues.createComment({
              owner, repo, issue_number: number,
              body: [
                '> ⛔ **XL cannot be committed or started.**',
                '>',
                `> An XL ticket is more than 5 days of work. Split it into at least ${MIN_SUB_ISSUES} sub-issues`,
                '> using **Create sub-issue** in the issue sidebar, then move it back.',
                '>',
                `> Sub-issues linked right now: **${count}**.`,
              ].join('\n'),
            });
            core.info(`#${number} blocked, XL with ${count} sub-issues`);
