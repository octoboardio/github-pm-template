name: 🧹 Stale Issue Cleanup

on:
  schedule:
    - cron: '0 8 * * 1'  # Every Monday at 8am UTC
  workflow_dispatch:

jobs:
  stale:
    runs-on: ${{ vars.PM_RUNNER || 'ubuntu-latest' }}
    permissions:
      issues: write
    steps:
      - uses: actions/stale@v11
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

          # Never close. A stale label is a signal, not a deletion.
          days-before-issue-stale: 60
          days-before-issue-close: -1
          days-before-pr-stale: 60
          days-before-pr-close: -1

          stale-issue-label: 'status: stale'
          stale-pr-label: 'status: stale'

          stale-issue-message: |
            > 🧹 **Stale notice**, no activity for 60 days.
            >
            > This issue will **not** be closed automatically. If it is still
            > relevant, leave a comment or add it to a milestone. If it is not,
            > close it by hand.

          stale-pr-message: |
            > 🧹 **Stale notice**, no activity for 60 days.
            >
            > This PR will **not** be closed automatically.

          exempt-issue-labels: 'P0: critical,P1: high,status: blocked,type: epic'
          exempt-pr-labels: 'P0: critical,P1: high,dependencies,security'
          exempt-draft-pr: true
          operations-per-run: 100
