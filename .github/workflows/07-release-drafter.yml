name: 📦 Release Drafter

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  draft-release:
    runs-on: ${{ vars.PM_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: release-drafter/release-drafter@v7
        with:
          config-name: release-drafter.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
