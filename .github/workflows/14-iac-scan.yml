name: 🛡️ IaC Security Scan

on:
  push:
    branches: [main]
    paths:
      - '**/*.tf'
      - '**/*.tfvars'
      - '**/*.hcl'
      - '**/Dockerfile*'
      - '**/docker-compose*.yml'
      - '**/docker-compose*.yaml'
      - '**/*.sh'
      - '**/k8s/**'
      - '**/helm/**'
      - '**/manifests/**'
  pull_request:
    branches: [main]
    paths:
      - '**/*.tf'
      - '**/*.tfvars'
      - '**/*.hcl'
      - '**/Dockerfile*'
      - '**/docker-compose*.yml'
      - '**/docker-compose*.yaml'
      - '**/*.sh'
      - '**/k8s/**'
      - '**/helm/**'
      - '**/manifests/**'
  schedule:
    - cron: '0 4 * * 1'

jobs:
  trivy-iac:
    name: Trivy IaC Scan
    runs-on: ${{ vars.PM_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
      security-events: write
      pull-requests: write
      # upload-sarif reads the workflow run, and a permissions block sets every
      # unlisted scope to none.
      actions: read
    steps:
      - uses: actions/checkout@v7
      - name: Run Trivy config scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
      # SARIF upload requires GHAS code-scanning. On forks and PRs from
      # forked repos the token can't write; skip it there. On the same
      # repo it works once GHAS is enabled.
      - name: Upload to GitHub Security tab
        if: always() && github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-iac
        continue-on-error: true

  tfsec:
    name: tfsec Terraform Scan
    runs-on: ${{ vars.PM_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - name: Check for Terraform files
        id: check
        run: |
          count=$(find . -name "*.tf" 2>/dev/null | grep -cv "./.git" || true)
          echo "tf_count=$count" >> "$GITHUB_OUTPUT"
      - name: Run tfsec
        if: steps.check.outputs.tf_count != '0'
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          soft_fail: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Skip
        if: steps.check.outputs.tf_count == '0'
        run: echo "No .tf files found, tfsec skipped."

  hadolint:
    name: Dockerfile Lint
    runs-on: ${{ vars.PM_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
      - name: Check for Dockerfiles
        id: check
        run: |
          count=$(find . -name "Dockerfile*" 2>/dev/null | grep -cv "./.git" || true)
          echo "count=$count" >> "$GITHUB_OUTPUT"
      - name: Run hadolint
        if: steps.check.outputs.count != '0'
        uses: hadolint/hadolint-action@v3.5.0
        with:
          recursive: true
          failure-threshold: warning
      - name: Skip
        if: steps.check.outputs.count == '0'
        run: echo "No Dockerfiles found, hadolint skipped."