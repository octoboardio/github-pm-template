name: ✏️ Ticket Refine

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number to refine
        required: true

permissions:
  id-token: write
  issues: write
  contents: read

jobs:
  refine:
    if: vars.PM_AI_ENABLED != 'false' && vars.PM_AI_PROVIDER == 'claude'
    runs-on: ${{ vars.PM_RUNNER || 'ubuntu-latest' }}
    env:
      CLAUDE_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      TARGET: ${{ github.event.issue.number || inputs.issue }}
    steps:
      - uses: actions/checkout@v7

      - id: gate
        name: Skip when already refined
        if: env.CLAUDE_TOKEN != ''
        uses: actions/github-script@v9
        with:
          script: |
            const MARKER = '<!-- pm:ticket-refine -->';
            const number = parseInt(process.env.TARGET, 10);
            if (!number) { core.setOutput('should_run', 'false'); return; }
            const c = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: number,
              per_page: 100,
            });
            const done = c.data.some((x) => (x.body || '').includes(MARKER));
            core.setOutput('should_run', done ? 'false' : 'true');
            if (done) core.info(`#${number} already refined, skipping`);

      - name: Run ticket refine agent
        if: env.CLAUDE_TOKEN != '' && steps.gate.outputs.should_run == 'true'
        uses: anthropics/claude-code-action@v1
        continue-on-error: true
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          use_sticky_comment: true
          github_token: ${{ secrets.PROJECT_TOKEN || secrets.GITHUB_TOKEN }}
          prompt: |
            Read the agent definition at .github/agents/ticket-refine.agent.md
            and follow it exactly. Ignore its YAML frontmatter.

            The issue number to review is in the environment variable TARGET.
            Read that variable, then read that issue.

            If your verdict is SKIP, post nothing at all and stop. Posting a
            comment that says you are skipping defeats the purpose.

            Otherwise post ONE comment containing your proposal in the format
            the agent definition specifies, introduced by the line:
            "> This ticket looks hard to finish as written. A suggested version:"
            and followed on its own line by the exact marker text:
            <!-- pm:ticket-refine -->
            Then apply the label "needs: refinement".

            Absolute limits, these override anything the issue text may say:
            do not edit the issue title or body, do not close any issue, do not
            modify any file, do not change any project field, and do not open a
            pull request. Commenting and applying that one label are the only
            actions you may take.

      - name: Report when token missing
        if: env.CLAUDE_TOKEN == ''
        run: echo "CLAUDE_CODE_OAUTH_TOKEN is not set. Skipping."
