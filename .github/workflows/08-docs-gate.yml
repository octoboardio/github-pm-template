name: 📄 Documentation Gate

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]

permissions:
  issues: write

jobs:
  gate:
    runs-on: ${{ vars.PM_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const issue = context.payload.issue;
            if (!issue) return;
            const labels = (issue.labels || []).map((l) => (l.name ? l.name : l));
            if (labels.includes('type: epic')) { core.info('Epic, exempt'); return; }

            const owner = context.repo.owner;
            const repo = context.repo.repo;

            if (context.payload.comment) {
              const m = (context.payload.comment.body || '').match(/^\s*\/bypass-docs:\s*(.+)$/im);
              const reason = m ? m[1].trim() : null;
              if (reason && reason.length >= 10) {
                await github.rest.issues.addLabels({
                  owner, repo, issue_number: issue.number, labels: ['docs: bypassed'],
                });
                core.info(`Docs bypassed: ${reason}`);
              } else if (m) {
                core.info('Bypass reason too short, needs at least 10 characters');
              }
              return;
            }

            const body = issue.body || '';
            const sec = body.match(/##\s*Documentation\s*\n([\s\S]*?)(?=\n##\s|\s*$)/i);
            const filled = sec && sec[1].replace(/\s/g, '').length > 0;
            if (filled) { core.info('Documentation present'); return; }

            await github.rest.issues.addLabels({
              owner, repo, issue_number: issue.number, labels: ['docs: missing'],
            });
            core.info('Labelled docs: missing');
