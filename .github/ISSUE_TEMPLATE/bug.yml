name: Bug
description: Something is broken
labels: ["type: bug", "P1: high", "docs: missing"]
body:
  - type: markdown
    attributes:
      value: "## Bug Report"

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What is happening vs what should happen
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      value: "1. \n2. \n3. "
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "EKS 1.27 / Ubuntu 22.04 / main branch"
    validations:
      required: true

  - type: input
    id: doc-link
    attributes:
      label: Doc Link
      description: Link to the runbook or postmortem in your docs tool
      placeholder: "https://docs.example.com/runbooks/service-name"

  - type: textarea
    id: documentation
    attributes:
      label: Documentation
      description: "Runbook or postmortem that needs updating. Or post /bypass-docs: <reason> as a comment."
      placeholder: "What runbook or postmortem needs to be created/updated?"

  - type: input
    id: client-ticket
    attributes:
      label: Client Ticket
      placeholder: "PROJ-123 | https://your-tracker.example.com/browse/PROJ-123"

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - "P0: Critical"
        - "P1: High"
        - "P2: Medium"
        - "P3: Low"
      default: 1
    validations:
      required: true

  - type: dropdown
    id: size
    attributes:
      label: Size
      options: [XS, S, M, L, XL]
      default: 1
    validations:
      required: true
